# Окремий compose-стек. Не додавати ці сервіси в інші compose-файли:
# ізоляція тримається на окремому проєкті (= назві директорії).
services:
  santabot:
    build: .
    container_name: santabot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/santa.db
    volumes:
      - ./data:/app/data
    mem_limit: 256m
    # 0.4 ядра = 20% 2-vCPU сервера; у спокої бот їсть 0%, ліміт відчутний лише на старті
    cpus: 0.4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
